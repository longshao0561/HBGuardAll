name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux 优先：runner 秒开
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld make git curl xz-utils
          if ! command -v ldid >/dev/null 2>&1; then
            curl -fsSL -o /tmp/ldid \
              https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 \
              && sudo install -m755 /tmp/ldid /usr/local/bin/ldid
          fi
          ldid -v 2>/dev/null || true
          clang --version | head -1

      - name: Clone Theos
        run: |
          set -x
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          cd "$HOME/theos"
          git submodule update --init --recursive --depth 1
          ls vendor/include/substrate.h && echo "substrate.h OK"
          test -d "$HOME/theos/makefiles" && echo "theos OK"

      - name: Linux toolchain shim
        run: |
          set -x
          TC="$HOME/theos/toolchain/linux/iphone/bin"
          mkdir -p "$TC"
          ln -sf "$(command -v clang)"   "$TC/clang"
          ln -sf "$(command -v clang++)" "$TC/clang++"
          LD64="$(command -v ld64.lld || find /usr -name 'ld64.lld' 2>/dev/null | head -1)"
          echo "ld64=$LD64"
          if [ -n "$LD64" ]; then
            ln -sf "$LD64" "$TC/ld64"
            sudo ln -sf "$LD64" /usr/local/bin/ld64.lld
            sudo ln -sf "$LD64" /usr/local/bin/ld64
          fi
          LDID="$(command -v ldid || true)"
          [ -n "$LDID" ] && ln -sf "$LDID" "$TC/ldid"
          ls -la "$TC"
          which ld64.lld ld64 || true

      - name: Fetch single iOS SDK (sparse)
        run: |
          set -o pipefail
          set -x
          SDK=iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          git init -q
          git remote add origin https://github.com/theos/sdks.git
          git config core.sparseCheckout true
          printf '%s/*\n' "$SDK" > .git/info/sparse-checkout
          git fetch --depth 1 --filter=blob:none origin master
          git checkout -q FETCH_HEAD
          du -sh "$HOME/theos/sdks/$SDK" || true
          test -d "$HOME/theos/sdks/$SDK" && echo "SDK OK"

      - name: Build
        run: |
          set -x
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          echo "THEOS=$THEOS"

          set +e
          make -j4 DEBUG=0 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          echo "make exit code = $rc"

          echo "===== tail ====="
          tail -40 /tmp/build.log

          if [ $rc -ne 0 ]; then
            tail -25 /tmp/build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=build::$line"
            done
          fi

          find .theos -name "*.dylib" -print -exec file {} \; 2>/dev/null || true
          exit $rc

      - name: Upload dylib
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HBGuard-dylib-linux
          path: .theos/obj/**/*.dylib
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux
          path: /tmp/build.log
          if-no-files-found: warn

  # macOS 兜底
  build-macos:
    runs-on: macos-13
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid xz >/dev/null 2>&1 || true

      - name: Setup Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          cd "$HOME/theos"
          git submodule update --init --recursive --depth 1
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Build
        run: |
          set -o pipefail
          make -j4 DEBUG=0 2>&1 | tee /tmp/build-mac.log
          tail -30 /tmp/build-mac.log
          find .theos -name "*.dylib" -print

      - name: Upload dylib
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HBGuard-dylib-macos
          path: .theos/obj/**/*.dylib
          if-no-files-found: warn
