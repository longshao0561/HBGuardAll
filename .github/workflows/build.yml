name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux 优先：排队快，Theos 支持在 Linux 上交叉编译 iOS tweak
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld make git curl xz-utils fakeroot dpkg
          # ldid（签名用；apt 没有就下预编译）
          if ! command -v ldid >/dev/null 2>&1; then
            sudo apt-get install -y -qq ldid || {
              curl -fsSL -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
              sudo install -m755 /tmp/ldid /usr/local/bin/ldid
            }
          fi
          ldid -v || true
          ld64.lld --version || true
          clang --version | head -1

      - name: Setup Theos + SDK
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          # iOS SDK（Theos 官方 sdks 仓库）
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          ls "$HOME/theos/sdks" | head
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          make clean 2>/dev/null || true
          make -j4 DEBUG=0
          echo "--- produced ---"
          find .theos -name "*.dylib" -print -exec file {} \;

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HBGuard-dylib-linux
          path: .theos/obj/**/*.dylib
          if-no-files-found: error

  # macOS 兜底（Linux 那套工具链版本不匹配时用这个）
  build-macos:
    runs-on: macos-13
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid xz >/dev/null 2>&1 || true

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          make clean 2>/dev/null || true
          make -j4 DEBUG=0
          find .theos -name "*.dylib" -print

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HBGuard-dylib-macos
          path: .theos/obj/**/*.dylib
          if-no-files-found: warn
