name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm make git curl xz-utils
          if ! command -v ldid >/dev/null 2>&1; then
            curl -fsSL -o /tmp/ldid \
              https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 \
              && sudo install -m755 /tmp/ldid /usr/local/bin/ldid
          fi
          ldid -v 2>/dev/null || true
          clang --version | head -1

      - name: Clone Theos
        run: |
          set -x
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          cd "$HOME/theos"
          git submodule update --init --recursive --depth 1
          ls vendor/include/substrate.h && echo "substrate.h OK"

      - name: Linux toolchain shim
        run: |
          set -x
          TC="$HOME/theos/toolchain/linux/iphone/bin"
          mkdir -p "$TC"
          ln -sf "$(command -v clang)"   "$TC/clang"
          ln -sf "$(command -v clang++)" "$TC/clang++"
          LD64="$(command -v ld64.lld || find /usr -name 'ld64.lld' 2>/dev/null | head -1)"
          if [ -n "$LD64" ]; then
            ln -sf "$LD64" "$TC/ld64"
            sudo ln -sf "$LD64" /usr/local/bin/ld64.lld
            sudo ln -sf "$LD64" /usr/local/bin/ld64
          fi
          LDID="$(command -v ldid || true)"
          [ -n "$LDID" ] && ln -sf "$LDID" "$TC/ldid"
          STRIP="$(command -v llvm-strip || find /usr -name 'llvm-strip*' 2>/dev/null | head -1)"
          [ -n "$STRIP" ] && ln -sf "$STRIP" "$TC/strip"
          for t in llvm-objcopy llvm-nm llvm-objdump; do
            p="$(command -v $t || find /usr -name "$t*" 2>/dev/null | head -1)"
            [ -n "$p" ] && ln -sf "$p" "$TC/${t#llvm-}"
          done
          ls -la "$TC"

      - name: Fetch single iOS SDK (sparse)
        run: |
          set -o pipefail
          set -x
          SDK=iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          git init -q
          git remote add origin https://github.com/theos/sdks.git
          git config core.sparseCheckout true
          printf '%s/*\n' "$SDK" > .git/info/sparse-checkout
          git fetch --depth 1 --filter=blob:none origin master
          git checkout -q FETCH_HEAD
          test -d "$HOME/theos/sdks/$SDK" && echo "SDK OK"

      - name: Build
        run: |
          set -x
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"

          set +e
          make -j4 DEBUG=0 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          echo "make exit code = $rc"
          tail -40 /tmp/build.log
          if [ $rc -ne 0 ]; then
            tail -25 /tmp/build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=build::$line"
            done
          fi
          exit $rc

      # substrate 依赖降级为 weak：全能签（非越狱）环境没有完整 CydiaSubstrate
      - name: Patch substrate dep to weak
        run: |
          set -euo pipefail
          set -x
          DYLIB="$(find .theos -name '*.dylib' | head -1)"
          test -n "$DYLIB"
          python3 tools/patch_weak_substrate.py "$DYLIB"

      - name: Verify dylib
        if: always()
        run: |
          set -x
          DYLIB="$(find .theos -name '*.dylib' | head -1)"
          [ -z "$DYLIB" ] && exit 1
          echo "===== file ====="
          file "$DYLIB"
          echo "===== 依赖（substrate 必须是 weak） ====="
          (llvm-otool -L "$DYLIB" 2>/dev/null || llvm-objdump --macho --dylibs-used "$DYLIB" 2>/dev/null) || true
          echo "===== 自检：substrate 是否还是硬链接 ====="
          python3 tools/patch_weak_substrate.py "$DYLIB" || true
          echo "===== 大小 ====="
          ls -la "$DYLIB"; sha256sum "$DYLIB"

      - name: Upload dylib
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HBGuard-dylib-linux
          path: .theos/obj/**/*.dylib
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux
          path: /tmp/build.log
          if-no-files-found: warn

  release:
    needs: build-linux
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HBGuard-dylib-linux
          path: dist

      - name: List
        run: find dist -type f -exec ls -la {} \;

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set -x
          DYLIB="$(find dist -name '*.dylib' | head -1)"
          test -n "$DYLIB"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest \
              --title "HBGuard latest build" \
              --prerelease \
              --notes "arm64；substrate 依赖已降级为 weak，全能签可直接注入。"
          gh release upload latest "$DYLIB" --clobber
          gh release view latest
